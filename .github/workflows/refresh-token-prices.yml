name: Refresh token prices

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Warm token price cache
        run: curl -fsS "$TOKEN_PRICES_URL"
        env:
          TOKEN_PRICES_URL: https://token-prices-api.onrender.com/api/openai/prices?refresh=1

