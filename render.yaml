services:
  - type: web
    name: token-prices-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: python3 -m pip install -r requirements.txt
    startCommand: python3 -u scripts/run_token_pricing_server.py --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TOKEN_PRICES_CACHE_TTL_SECONDS
        value: "604800"

